<body>
    <div class="container">
        <header>
            <h1>🔥 2025-2026 한국 밈 퀴즈 🔥</h1>
            <p class="subtitle">올해 가장 핫한 밈, 얼마나 알고 계신가요?</p>
        </header>

        <!-- Ad Space Top -->
        <div class="ad-space">
            <!-- Google AdSense Display Ad - Replace with your ad unit code -->

            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>

        </div>

        <div id="quiz-container">
            <div id="start-screen" class="screen active">
                <div class="start-content">
                    <h2>밈 지식 테스트 준비되셨나요?</h2>
                    <p>2025-2026 최신 한국 밈 12문제</p>
                    <p class="challenge">🏆 완벽한 점수를 받을 수 있을까요?</p>
                    <button onclick="startQuiz()" class="btn-start">퀴즈 시작</button>
                </div>
            </div>

            <div id="quiz-screen" class="screen">
                <div class="progress-bar">
                    <div id="progress" class="progress-fill"></div>
                </div>
                <div class="question-number" id="question-number">질문 1 / 12</div>
                
                <div class="question-container">
                    <h2 id="question-text" class="question-text"></h2>
                    <div id="image-container" class="image-container"></div>
                    <div id="options-container" class="options-container"></div>
                </div>
            </div>

            <div id="result-screen" class="screen">
                <div class="result-content">
                    <h2>당신의 점수</h2>
                    <div class="score-display" id="score-display"></div>
                    <p id="result-message" class="result-message"></p>
                    <div class="result-breakdown" id="result-breakdown"></div>
                    
                    <div class="share-buttons">
                        <button onclick="shareTwitter()" class="btn-share twitter">트위터 공유</button>
                        <button onclick="copyLink()" class="btn-share copy">링크 복사</button>
                    </div>
                    
                    <button onclick="restartQuiz()" class="btn-restart">다시 도전</button>
                </div>
            </div>
        </div>

        <!-- Ad Space Bottom -->
        <div class="ad-space">
